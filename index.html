<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Надтай гарах уу?</title>
<meta property="og:title" content="Надтай хамт гадуур гарах уу?">
<meta property="og:description" content="Болзооны урилга — нээж хариулаарай 💗">
<meta property="og:image" content="preview.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Надтай хамт гадуур гарах уу?">
<meta name="twitter:description" content="Болзооны урилга — нээж хариулаарай 💗">
<meta name="twitter:image" content="preview.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Quicksand:wght@500;600;700&display=swap');

  :root{
    --bg1:#1a0f22;
    --bg2:#2b1330;
    --pink:#f0a8c4;
    --pink-bright:#ff8fb3;
    --gold:#f4c98a;
    --card:#ffffff10;
    --card-border:#ffffff1a;
    --text:#f3e9f3;
    --dim:#c9b8cf;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 50% 20%, #4a1f4a55, transparent 60%),
      radial-gradient(circle at 20% 80%, #2a1a4a55, transparent 60%),
      linear-gradient(180deg, var(--bg1), var(--bg2));
    font-family:'Quicksand', sans-serif;
    color:var(--text);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    overflow-x:hidden;
    position:relative;
  }

  .heart-float{
    position:fixed;
    pointer-events:none;
    color:var(--pink-bright);
    opacity:.5;
    animation:drift linear infinite;
    z-index:0;
  }
  @keyframes drift{
    0%{transform:translateY(0) rotate(0deg); opacity:0;}
    10%{opacity:.5;}
    90%{opacity:.4;}
    100%{transform:translateY(-110vh) rotate(20deg); opacity:0;}
  }

  .card{
    position:relative;
    z-index:1;
    width:100%;
    max-width:520px;
    background:linear-gradient(160deg, #2e1a3a99, #1c0f2699);
    border:1px solid var(--card-border);
    border-radius:28px;
    padding:32px 28px 40px;
    backdrop-filter:blur(12px);
    box-shadow:0 20px 60px #00000066;
  }

  .music-toggle{
    position:absolute;
    bottom:16px;
    right:16px;
    z-index:5;
    width:38px;
    height:38px;
    border-radius:50%;
    border:1px solid var(--card-border);
    background:#ffffff14;
    color:var(--text);
    font-size:16px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:.2s;
  }
  .music-toggle:hover{background:#ffffff26;}
  .music-toggle.playing{
    background:linear-gradient(90deg, var(--pink-bright), var(--gold));
    animation:musicSpin 3s linear infinite;
    border-color:transparent;
  }
  @keyframes musicSpin{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
  }

  .progress{
    display:flex;
    gap:8px;
    margin-bottom:24px;
  }
  .progress span{
    flex:1;
    height:5px;
    border-radius:4px;
    background:#ffffff1a;
    overflow:hidden;
  }
  .progress span i{
    display:block;
    height:100%;
    width:0%;
    background:linear-gradient(90deg, var(--pink-bright), var(--gold));
    transition:width .4s ease;
  }
  .progress span.done i{width:100%;}
  .progress span.active i{width:100%;}

  .back-btn{
    background:none;
    border:none;
    color:var(--dim);
    font-family:inherit;
    font-size:14px;
    cursor:pointer;
    margin-bottom:8px;
    padding:4px 0;
    opacity:.8;
  }
  .back-btn:hover{opacity:1;}
  .back-btn.hidden{visibility:hidden;}

  .step{display:none;}
  .step.is-active{display:block; animation:fadein .4s ease;}
  @keyframes fadein{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}

  /* mascots: every emoji bounces like a little animated sticker */
  .mascot{
    display:block;
    margin:8px auto 12px;
    font-size:64px;
    text-align:center;
    animation:jelly 1.8s ease-in-out infinite;
    filter:drop-shadow(0 6px 14px #00000066);
  }
  .mascot.duo span{display:inline-block; animation:jelly 1.8s ease-in-out infinite;}
  .mascot.duo span:nth-child(2){animation-delay:.3s; animation-name:jellyR;}
  @keyframes jelly{
    0%,100%{transform:translateY(0) scale(1,1) rotate(0deg);}
    20%{transform:translateY(-14px) scale(.94,1.08) rotate(-6deg);}
    45%{transform:translateY(0) scale(1.1,.9) rotate(3deg);}
    65%{transform:translateY(-6px) scale(.97,1.04) rotate(-2deg);}
    100%{transform:translateY(0) scale(1,1) rotate(0deg);}
  }
  @keyframes jellyR{
    0%,100%{transform:translateY(0) scale(1,1) rotate(0deg);}
    20%{transform:translateY(-14px) scale(.94,1.08) rotate(6deg);}
    45%{transform:translateY(0) scale(1.1,.9) rotate(-3deg);}
    65%{transform:translateY(-6px) scale(.97,1.04) rotate(2deg);}
    100%{transform:translateY(0) scale(1,1) rotate(0deg);}
  }

  h2.title{
    font-family:'Caveat', cursive;
    font-size:42px;
    text-align:center;
    line-height:1.15;
    margin:0 0 24px;
    color:var(--pink);
    font-weight:700;
  }

  .grid4{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-bottom:18px;
  }
  .grid2{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin-bottom:24px;
  }
  .subhead{
    text-align:center;
    color:var(--dim);
    font-size:13px;
    margin:6px 0 12px;
  }
  .chip{
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:16px;
    padding:14px 6px;
    text-align:center;
    color:var(--text);
    font-family:inherit;
    font-weight:600;
    cursor:pointer;
    transition:.2s;
  }
  .chip small{display:block; color:var(--dim); font-size:11px; font-weight:500; margin-top:2px;}
  .chip:hover{background:#ffffff1e; transform:translateY(-2px);}
  .chip.selected{
    background:linear-gradient(160deg, #ff8fb333, #f4c98a22);
    border-color:var(--pink-bright);
    box-shadow:0 0 0 1px var(--pink-bright) inset;
  }

  .choices{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    margin-bottom:8px;
  }
  .choice{
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:18px;
    padding:20px 16px;
    text-align:left;
    cursor:pointer;
    color:var(--text);
    font-family:inherit;
    transition:.2s;
  }
  .choice:hover{background:#ffffff1e; transform:translateY(-3px);}
  .choice.selected{
    background:linear-gradient(160deg, #ff8fb333, #f4c98a22);
    border-color:var(--pink-bright);
  }
  .choice .emoji{font-size:26px; display:inline-block; margin-bottom:10px; animation:jelly 2s ease-in-out infinite;}
  .choice:nth-child(2) .emoji{animation-delay:.15s;}
  .choice:nth-child(3) .emoji{animation-delay:.3s;}
  .choice:nth-child(4) .emoji{animation-delay:.45s;}
  .choice .label{font-weight:700; font-size:16px; display:block;}
  .choice .sub{color:var(--dim); font-size:12.5px; display:block; margin-top:2px;}

  .next-btn{
    display:block;
    width:100%;
    margin-top:8px;
    padding:14px;
    border:none;
    border-radius:16px;
    background:linear-gradient(90deg, var(--pink-bright), var(--gold));
    color:#2b1330;
    font-family:inherit;
    font-weight:700;
    font-size:16px;
    cursor:pointer;
    opacity:.4;
    pointer-events:none;
    transition:.25s;
  }
  .next-btn.ready{opacity:1; pointer-events:auto;}
  .next-btn.ready:hover{transform:translateY(-2px); box-shadow:0 8px 24px #ff8fb355;}

  /* yes/no step */
  .final-wrap{
    text-align:center;
    min-height:180px;
    position:relative;
  }
  .yesno{
    display:flex;
    gap:16px;
    justify-content:center;
    margin-top:28px;
    position:relative;
    height:70px;
  }
  #yes, #no{
    padding:14px 28px;
    border-radius:16px;
    border:none;
    font-family:inherit;
    font-weight:700;
    font-size:16px;
    cursor:pointer;
  }
  #yes{
    background:linear-gradient(90deg, var(--pink-bright), var(--gold));
    color:#2b1330;
    transform:scale(var(--grow,1));
    transition:transform .25s ease;
    box-shadow:0 0 24px #ff8fb355;
  }
  #no{
    background:var(--card);
    border:1px solid var(--card-border);
    color:var(--text);
    position:relative;
    transition:transform .18s ease, opacity .18s ease;
  }
  #no.is-loose{
    position:fixed;
  }

  /* yaas confirm overlay */
  .yaas-wrap{
    display:none;
    text-align:center;
    padding:40px 0 20px;
    position:relative;
    overflow:visible;
  }
  .yaas-wrap.show{display:block; animation:popin .5s cubic-bezier(.34,1.56,.64,1);}
  @keyframes popin{
    0%{transform:scale(.4) rotate(-8deg); opacity:0;}
    60%{transform:scale(1.08) rotate(2deg); opacity:1;}
    100%{transform:scale(1) rotate(0deg); opacity:1;}
  }
  .yaas-text{
    font-family:'Caveat', cursive;
    font-weight:700;
    font-size:60px;
    color:var(--gold);
    -webkit-text-stroke:1.5px #2b1330;
    text-shadow:0 0 28px #f4c98a99;
    animation:textPop 1.4s ease-in-out infinite;
  }
  @keyframes textPop{
    0%,100%{transform:scale(1) rotate(-2deg);}
    50%{transform:scale(1.08) rotate(2deg);}
  }
  .yaas-mascot{
    font-size:78px;
    animation:yaasBounce .9s cubic-bezier(.36,.07,.19,.97) infinite;
  }
  @keyframes yaasBounce{
    0%,100%{transform:translateY(0) scale(1,1);}
    30%{transform:translateY(-26px) scale(.95,1.08);}
    50%{transform:translateY(0) scale(1.12,.88);}
    70%{transform:translateY(-10px) scale(.98,1.04);}
  }
  .yaas-sparkle{
    position:absolute;
    font-size:22px;
    animation:sparklePop 1.1s ease-out infinite;
    opacity:0;
  }
  @keyframes sparklePop{
    0%{transform:scale(0) translateY(0); opacity:0;}
    35%{opacity:1;}
    100%{transform:scale(1.3) translateY(-30px); opacity:0;}
  }

  /* ticket */
  .ticket{
    display:flex;
    border-radius:18px;
    overflow:hidden;
    margin:20px 0 18px;
    box-shadow:0 16px 40px #00000066;
  }
  .ticket-left{
    width:30%;
    background:linear-gradient(160deg, var(--pink-bright), #ffd2e0);
    color:#5c1638;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    padding:14px 8px;
    text-align:center;
    border-right:2px dashed #ffffff88;
  }
  .ticket-left .emoji{font-size:30px; animation:jelly 2.2s ease-in-out infinite;}
  .ticket-left b{font-size:11px; letter-spacing:.5px; margin-top:2px;}
  .ticket-left small{font-size:9px; opacity:.75;}
  .ticket-left .qr-box{background:#fff; border-radius:5px; padding:4px; margin-top:4px; line-height:0;}
  .ticket-left .barcode{
    width:80%;
    height:12px;
    margin-top:4px;
    background:repeating-linear-gradient(90deg, #5c1638 0 2px, transparent 2px 4px, #5c1638 4px 5px, transparent 5px 8px, #5c1638 8px 9px, transparent 9px 13px);
    opacity:.5;
  }
  .ticket-right{
    flex:1;
    background:#fdf3f0;
    color:#3a1730;
    padding:12px 16px;
  }
  .ticket-right .kicker{
    font-size:10px;
    letter-spacing:1px;
    font-weight:700;
    color:var(--pink-bright);
    margin-bottom:4px;
  }
  .ticket-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:0 16px;
  }
  .ticket-cell{
    display:flex;
    flex-direction:column;
    gap:0;
    padding:4px 0;
    border-bottom:1px solid #00000010;
  }
  .ticket-cell.wide{grid-column:1/-1;}
  .ticket-cell .k{
    font-size:9px;
    text-transform:uppercase;
    letter-spacing:.5px;
    color:#8a6b78;
  }
  .ticket-cell .v{font-weight:700; font-size:12.5px; line-height:1.25;}
  .card.wide{max-width:640px;}

  .countdown{
    text-align:center;
    color:var(--dim);
    font-size:12px;
    letter-spacing:1px;
    text-transform:uppercase;
    margin-bottom:20px;
  }
  .countdown b{
    display:block;
    color:var(--gold);
    font-size:20px;
    font-family:'Quicksand';
    letter-spacing:2px;
    margin-top:4px;
  }

  .action-row{
    display:flex;
    gap:12px;
    justify-content:center;
  }
  .btn-solid{
    padding:14px 26px;
    border-radius:16px;
    border:none;
    background:linear-gradient(90deg, var(--pink-bright), var(--gold));
    color:#2b1330;
    font-family:inherit;
    font-weight:700;
    font-size:15px;
    cursor:pointer;
  }
  .btn-outline{
    padding:14px 26px;
    border-radius:16px;
    border:1px solid var(--pink-bright);
    background:transparent;
    color:var(--pink);
    font-family:inherit;
    font-weight:700;
    font-size:15px;
    cursor:pointer;
  }
</style>
</head>
<body>

<div class="card">
  <button class="music-toggle" id="musicToggle" title="Fall in Love with You – Montell Fish">🎵</button>
  <div id="musicPlayer" style="position:absolute; width:1px; height:1px; overflow:hidden; opacity:0; pointer-events:none;"></div>
  <div class="progress" id="progress">
    <span data-i="0"><i></i></span>
    <span data-i="1"><i></i></span>
    <span data-i="2"><i></i></span>
    <span data-i="3"><i></i></span>
    <span data-i="4"><i></i></span>
    <span data-i="5"><i></i></span>
  </div>
  <button class="back-btn hidden" id="backBtn">← буцах</button>

  <!-- Step 0: Yes / No -->
  <section class="step is-active" id="s-yesno">
    <div class="final-wrap" id="yesnoWrap">
      <div class="mascot">
        <svg viewBox="0 0 240 190" width="168" height="133" xmlns="http://www.w3.org/2000/svg">
          <path d="M108 138 Q68 128 60 96" stroke="#5c3a1e" stroke-width="5" fill="none" stroke-linecap="round"/>
          <ellipse cx="152" cy="150" rx="50" ry="42" fill="#c98a52" stroke="#5c3a1e" stroke-width="4"/>
          <circle cx="152" cy="88" r="52" fill="#c98a52" stroke="#5c3a1e" stroke-width="4"/>
          <circle cx="114" cy="46" r="20" fill="#c98a52" stroke="#5c3a1e" stroke-width="4"/>
          <circle cx="114" cy="46" r="9" fill="#f4dfc0"/>
          <circle cx="190" cy="46" r="20" fill="#c98a52" stroke="#5c3a1e" stroke-width="4"/>
          <circle cx="190" cy="46" r="9" fill="#f4dfc0"/>
          <circle cx="136" cy="90" r="5" fill="#3a2a20"/>
          <circle cx="168" cy="90" r="5" fill="#3a2a20"/>
          <ellipse cx="122" cy="106" rx="8" ry="6" fill="#ffb6c9" opacity=".7"/>
          <ellipse cx="182" cy="106" rx="8" ry="6" fill="#ffb6c9" opacity=".7"/>
          <path d="M144 108 Q152 116 160 108" stroke="#3a2a20" stroke-width="3" fill="none" stroke-linecap="round"/>
          <ellipse cx="90" cy="155" rx="50" ry="42" fill="#fff9f2" stroke="#3a2a20" stroke-width="4"/>
          <circle cx="90" cy="95" r="52" fill="#fff9f2" stroke="#3a2a20" stroke-width="4"/>
          <circle cx="52" cy="53" r="20" fill="#fff9f2" stroke="#3a2a20" stroke-width="4"/>
          <circle cx="52" cy="53" r="9" fill="#ffd0da"/>
          <circle cx="128" cy="53" r="20" fill="#fff9f2" stroke="#3a2a20" stroke-width="4"/>
          <circle cx="128" cy="53" r="9" fill="#ffd0da"/>
          <path d="M66 90 Q72 84 78 90" stroke="#3a2a20" stroke-width="3" fill="none" stroke-linecap="round"/>
          <path d="M100 90 Q106 84 112 90" stroke="#3a2a20" stroke-width="3" fill="none" stroke-linecap="round"/>
          <ellipse cx="60" cy="112" rx="8" ry="6" fill="#ffb6c9" opacity=".7"/>
          <ellipse cx="118" cy="112" rx="8" ry="6" fill="#ffb6c9" opacity=".7"/>
          <ellipse cx="89" cy="112" rx="6" ry="7" fill="#e8829c"/>
          <path d="M128 144 Q168 132 176 100" stroke="#3a2a20" stroke-width="4" fill="none" stroke-linecap="round"/>
          <text x="52" y="34" font-size="24">💗</text>
          <text x="150" y="24" font-size="18">💕</text>
        </svg>
      </div>
      <h2 class="title">Надтай хамт гадуур<br>гарах уу?</h2>
      <p class="subhead">Зөвхөн нэг л зөв хариулт бий.</p>
      <div class="yesno">
        <button id="yes">Тийм!</button>
        <button id="no">Үгүй</button>
      </div>
    </div>
    <div class="yaas-wrap" id="yaasWrap">
      <span class="yaas-sparkle" style="left:30%; top:10px; animation-delay:.05s;">✨</span>
      <span class="yaas-sparkle" style="right:28%; top:0; animation-delay:.2s;">💗</span>
      <span class="yaas-sparkle" style="left:18%; top:60px; animation-delay:.35s;">⭐</span>
      <span class="yaas-sparkle" style="right:16%; top:80px; animation-delay:.15s;">✨</span>
      <div class="yaas-mascot">
        <svg viewBox="0 0 160 160" width="120" height="120" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="80" cy="128" rx="42" ry="34" fill="#fff9f2" stroke="#3a2a20" stroke-width="4"/>
          <circle cx="80" cy="70" r="46" fill="#fff9f2" stroke="#3a2a20" stroke-width="4"/>
          <circle cx="46" cy="34" r="17" fill="#fff9f2" stroke="#3a2a20" stroke-width="4"/>
          <circle cx="46" cy="34" r="7" fill="#ffd0da"/>
          <circle cx="114" cy="34" r="17" fill="#fff9f2" stroke="#3a2a20" stroke-width="4"/>
          <circle cx="114" cy="34" r="7" fill="#ffd0da"/>
          <circle cx="64" cy="68" r="5" fill="#3a2a20"/>
          <circle cx="96" cy="68" r="5" fill="#3a2a20"/>
          <ellipse cx="52" cy="86" rx="7" ry="5" fill="#ffb6c9" opacity=".7"/>
          <ellipse cx="108" cy="86" rx="7" ry="5" fill="#ffb6c9" opacity=".7"/>
          <ellipse cx="80" cy="88" rx="9" ry="11" fill="#e8829c"/>
          <path d="M40 120 Q10 100 6 66" stroke="#3a2a20" stroke-width="5" fill="none" stroke-linecap="round"/>
          <path d="M118 120 Q112 96 92 92" stroke="#3a2a20" stroke-width="5" fill="none" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="yaas-text">ЯАС!</div>
    </div>
  </section>

  <!-- Step 1: when -->
  <section class="step" id="s-when">
    <div class="mascot">
      <svg viewBox="0 0 160 170" width="130" height="138" xmlns="http://www.w3.org/2000/svg">
        <path d="M80 165 C20 130 10 90 40 68 C58 56 78 68 80 84 C82 68 102 56 120 68 C150 90 140 130 80 165 Z" fill="#ff9fbd" stroke="#c5537a" stroke-width="3"/>
        <ellipse cx="60" cy="86" rx="14" ry="8" fill="#ffffff55"/>
        <ellipse cx="80" cy="102" rx="34" ry="26" fill="#fff9f2" stroke="#3a2a20" stroke-width="4"/>
        <circle cx="80" cy="58" r="34" fill="#fff9f2" stroke="#3a2a20" stroke-width="4"/>
        <circle cx="58" cy="34" r="13" fill="#fff9f2" stroke="#3a2a20" stroke-width="4"/>
        <circle cx="58" cy="34" r="5" fill="#ffd0da"/>
        <circle cx="102" cy="34" r="13" fill="#fff9f2" stroke="#3a2a20" stroke-width="4"/>
        <circle cx="102" cy="34" r="5" fill="#ffd0da"/>
        <circle cx="70" cy="58" r="4" fill="#3a2a20"/>
        <circle cx="90" cy="58" r="4" fill="#3a2a20"/>
        <ellipse cx="62" cy="72" rx="6" ry="4" fill="#ffb6c9" opacity=".7"/>
        <ellipse cx="98" cy="72" rx="6" ry="4" fill="#ffb6c9" opacity=".7"/>
        <path d="M74 74 Q80 79 86 74" stroke="#3a2a20" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      </svg>
    </div>
    <h2 class="title">Аанзаа! Хэзээ<br>чөлөөтэй вэ?</h2>
    <div class="grid4" role="radiogroup" id="dayGroup"></div>
    <div class="subhead" id="timeLabel" style="display:none;">мөн орчим цагаар нь...</div>
    <div class="grid4" role="radiogroup" id="timeGroup" style="display:none;"></div>
    <button class="next-btn" data-next>Дараах →</button>
  </section>

  <!-- Step 2: where -->
  <section class="step" id="s-where">
    <div class="mascot">
      <svg viewBox="0 0 160 170" width="120" height="128" xmlns="http://www.w3.org/2000/svg">

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
// ---------- background music: Fall in Love with You – Montell Fish ----------
const YT_VIDEO_ID = 'DbxOmAsowd0';
const musicBtn = document.getElementById('musicToggle');
const musicPlayer = document.getElementById('musicPlayer');
let musicPlaying = false;

musicBtn.addEventListener('click', ()=>{
  if(!musicPlaying){
    musicPlayer.innerHTML = `<iframe width="1" height="1" src="https://www.youtube.com/embed/${YT_VIDEO_ID}?autoplay=1&start=0" frameborder="0" allow="autoplay; encrypted-media"></iframe>`;
    musicBtn.classList.add('playing');
    musicBtn.textContent = '⏸';
    musicPlaying = true;
  } else {
    musicPlayer.innerHTML = '';
    musicBtn.classList.remove('playing');
    musicBtn.textContent = '🎵';
    musicPlaying = false;
  }
});

// ---------- floating hearts ----------
const HEART_CHARS = ['♥','❤','💗'];
for(let i=0;i<14;i++){
  const h = document.createElement('div');
  h.className = 'heart-float';
  h.textContent = HEART_CHARS[Math.floor(Math.random()*HEART_CHARS.length)];
  h.style.left = Math.random()*100+'vw';
  h.style.fontSize = (14+Math.random()*18)+'px';
  h.style.animationDuration = (8+Math.random()*10)+'s';
  h.style.animationDelay = (Math.random()*10)+'s';
  document.body.appendChild(h);
}

// ---------- state ----------
const state = { dayOffset:null, dayLabel:null, timeKey:null, timeLabel:null, where:null, bring:null, then:null };
const steps = ['s-yesno','s-when','s-where','s-bring','s-then','s-final'];
let current = 0;

const progressEls = [...document.querySelectorAll('#progress span')];
const backBtn = document.getElementById('backBtn');

function renderProgress(){
  progressEls.forEach((el,i)=>{
    el.classList.toggle('done', i < current);
    el.classList.toggle('active', i === current);
  });
  backBtn.classList.toggle('hidden', current === 0);
}

function showStep(i){
  steps.forEach((id,idx)=>{
    document.getElementById(id).classList.toggle('is-active', idx===i);
  });
  current = i;
  document.querySelector('.card').classList.toggle('wide', i === steps.length-1);
  renderProgress();
}
showStep(0);

backBtn.addEventListener('click', ()=>{
  if(current>0) showStep(current-1);
});

// ---------- step 0: yes / dodging no, then YAAS ----------
const LINES = [
  "болохгүй ээ", "үгүй дээ", "дахиад оролдоорой", "барьж чадахгүй",
  "нэг их дассан юм", "оролдоод байгаад л байна", "дахиад ч болохгүй", "чи ялахгүй шүү"
];
const no = document.getElementById('no');
const yes = document.getElementById('yes');
let dodges = 0;

function dodge(){
  dodges++;
  no.textContent = LINES[Math.min(dodges-1, LINES.length-1)];
  yes.style.setProperty('--grow', String(1 + Math.min(dodges,10)*.08));
  no.classList.add('is-loose');
  const shrink = Math.max(.55, 1 - dodges*.03);
  const w = no.offsetWidth * shrink, h = no.offsetHeight * shrink;
  const x = Math.random() * (window.innerWidth - w - 20) + 10;
  const y = Math.random() * (window.innerHeight - h - 20) + 10;
  no.style.left = x+'px';
  no.style.top = y+'px';
  no.style.transform = `scale(${shrink})`;
}
no.addEventListener('mouseenter', dodge);
no.addEventListener('touchstart', (e)=>{ e.preventDefault(); dodge(); }, {passive:false});
no.addEventListener('click', (e)=>{ e.preventDefault(); dodge(); });

yes.addEventListener('click', ()=>{
  document.getElementById('yesnoWrap').style.display = 'none';
  const yaas = document.getElementById('yaasWrap');
  yaas.classList.add('show');
  setTimeout(()=>{ showStep(1); }, 1100);
});

// ---------- step 1: when (day + time of day) ----------
const now = new Date();
const dayNamesMn = ['Ням','Даваа','Мягмар','Лхагва','Пүрэв','Баасан','Бямба'];
function fmtDate(d){ return `${d.getMonth()+1}/${d.getDate()}`; }

const dayDefs = [
  {label:'Өнөөдөр', offset:0},
  {label:'Маргааш', offset:1},
  {label: null, offset:2},
  {label: null, offset:3},
  {label: null, offset:4},
  {label:'Гайхуулаарай', offset:null, sub:'чи шийд'},
];
const dayGroup = document.getElementById('dayGroup');
dayDefs.forEach(d=>{
  const btn = document.createElement('button');
  btn.className = 'chip';
  let mainLabel, subLabel;
  if(d.offset === null){
    mainLabel = d.label; subLabel = d.sub;
  } else {
    const dt = new Date(now); dt.setDate(now.getDate()+d.offset);
    mainLabel = d.label || dayNamesMn[dt.getDay()];
    subLabel = fmtDate(dt);
  }
  btn.innerHTML = `${mainLabel}<small>${subLabel}</small>`;
  btn.dataset.offset = d.offset === null ? 'surprise' : d.offset;
  btn.dataset.label = mainLabel;
  dayGroup.appendChild(btn);
});

const timeDefs = [
  {label:'Өглөө', sub:'10:30', h:10, m:30},
  {label:'Өдөр', sub:'15:00', h:15, m:0},
  {label:'Орой', sub:'19:00', h:19, m:0},
  {label:'Шөнө дунд', sub:'21:30', h:21, m:30},
];
const timeGroup = document.getElementById('timeGroup');
timeDefs.forEach(t=>{
  const btn = document.createElement('button');
  btn.className = 'chip';
  btn.innerHTML = `${t.label}<small>${t.sub}</small>`;
  btn.dataset.label = t.label;
  btn.dataset.h = t.h; btn.dataset.m = t.m;
  timeGroup.appendChild(btn);
});

const whenNext = document.querySelector('#s-when .next-btn');
function checkWhenReady(){
  if(state.dayOffset !== null && state.timeKey !== null) whenNext.classList.add('ready');
}
dayGroup.addEventListener('click', (e)=>{
  const btn = e.target.closest('.chip');
  if(!btn) return;
  [...dayGroup.children].forEach(c=>c.classList.remove('selected'));
  btn.classList.add('selected');
  state.dayOffset = btn.dataset.offset;
  state.dayLabel = btn.dataset.label;
  document.getElementById('timeLabel').style.display = 'block';
  timeGroup.style.display = 'grid';
  checkWhenReady();
});
timeGroup.addEventListener('click', (e)=>{
  const btn = e.target.closest('.chip');
  if(!btn) return;
  [...timeGroup.children].forEach(c=>c.classList.remove('selected'));
  btn.classList.add('selected');
  state.timeKey = {h:+btn.dataset.h, m:+btn.dataset.m};
  state.timeLabel = btn.dataset.label + ' · ' + btn.textContent.replace(btn.dataset.label,'');
  state.timeLabelShort = btn.dataset.label;
  state.timeHM = `${String(btn.dataset.h).padStart(2,'0')}:${String(btn.dataset.m).padStart(2,'0')}`;
  checkWhenReady();
});
whenNext.addEventListener('click', ()=> showStep(2));

// ---------- generic choice groups (where / bring / then) ----------
function wireChoiceGroup(groupId, nextSelector, stateKey, onDone){
  const group = document.getElementById(groupId);
  const nextBtn = document.querySelector(nextSelector);
  group.addEventListener('click', (e)=>{
    const btn = e.target.closest('.choice');
    if(!btn) return;
    [...group.children].forEach(c=>c.classList.remove('selected'));
    btn.classList.add('selected');
    state[stateKey] = btn.dataset.key;
    nextBtn.classList.add('ready');
  });
  nextBtn.addEventListener('click', onDone);
}
wireChoiceGroup('whereGroup', '#s-where .next-btn', 'where', ()=> showStep(3));
wireChoiceGroup('bringGroup', '#s-bring .next-btn', 'bring', ()=> showStep(4));
wireChoiceGroup('thenGroup', '#s-then .next-btn', 'then', ()=>{
  buildTicket();
  showStep(5);
});

// ---------- final ticket ----------
let targetDate = null;
function buildTicket(){
  document.getElementById('ticketNo').textContent = '№ ' + (1000+Math.floor(Math.random()*9000));
  document.getElementById('tWhen').textContent = state.dayLabel;
  document.getElementById('tTime').textContent = (state.timeLabelShort||'—') + ' · ' + (state.timeHM||'');
  document.getElementById('tWhere').textContent = state.where;
  document.getElementById('tBring').textContent = state.bring;
  document.getElementById('tThen').textContent = state.then;

  const qrTarget = document.getElementById('qrCode');
  qrTarget.innerHTML = '';
  try{
    new QRCode(qrTarget, {
      text: window.location.href.split('#')[0],
      width: 52,
      height: 52,
      colorDark: '#3a1730',
      colorLight: '#ffffff'
    });
  }catch(e){ /* library not loaded yet, skip silently */ }

  let offset = state.dayOffset;
  if(offset === 'surprise') offset = 1 + Math.floor(Math.random()*4);
  else offset = +offset;
  targetDate = new Date(now);
  targetDate.setDate(now.getDate()+offset);
  targetDate.setHours(state.timeKey.h, state.timeKey.m, 0, 0);

  updateCountdown();
  clearInterval(window._cdInterval);
  window._cdInterval = setInterval(updateCountdown, 1000);
}

function updateCountdown(){
  const el = document.getElementById('countdown');
  const diff = targetDate - new Date();
  if(diff <= 0){ el.textContent = 'ЭХЭЛЛЭЭ 💗'; clearInterval(window._cdInterval); return; }
  const d = Math.floor(diff/86400000);
  const h = Math.floor((diff%86400000)/3600000);
  const m = Math.floor((diff%3600000)/60000);
  const s = Math.floor((diff%60000)/1000);
  el.textContent = `${d}Ө ${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

document.getElementById('addCal').addEventListener('click', ()=>{
  if(!targetDate) return;
  const end = new Date(targetDate.getTime()+2*3600000);
  const fmt = d => d.toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
  const details = `Хаашаа: ${state.where} | Авчрах: ${state.bring} | Дараа: ${state.then}`;
  const url = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent('Болзоо 💗')}&dates=${fmt(targetDate)}/${fmt(end)}&details=${encodeURIComponent(details)}`;
  window.open(url, '_blank');
});
document.getElementById('shareBtn').addEventListener('click', async ()=>{
  const text = `Бид болзоо тохирлоо: ${state.dayLabel}, ${state.timeLabelShort} — ${state.where} 💗`;
  if(navigator.share){
    try{ await navigator.share({ text }); }catch(e){}
  } else {
    try{ await navigator.clipboard.writeText(text); alert('Хуулагдлаа!'); }catch(e){}
  }
});

document.getElementById('saveImgBtn').addEventListener('click', async ()=>{
  const btn = document.getElementById('saveImgBtn');
  const original = btn.textContent;
  btn.textContent = 'Бэлдэж байна...';
  btn.disabled = true;
  try{
    const ticket = document.getElementById('ticketCard');
    const canvas = await html2canvas(ticket, { backgroundColor: '#2b1330', scale: 3, useCORS: true });
    canvas.toBlob(async (blob)=>{
      const file = new File([blob], 'bolzoo-tasalbar.png', { type: 'image/png' });
      if(navigator.canShare && navigator.canShare({ files:[file] })){
        try{
          await navigator.share({ files:[file], title:'Болзооны тасалбар' });
        }catch(e){ /* user cancelled */ }
      } else {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'bolzoo-tasalbar.png';
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(()=>URL.revokeObjectURL(url), 2000);
      }
      btn.textContent = original;
      btn.disabled = false;
    }, 'image/png');
  }catch(e){
    btn.textContent = original;
    btn.disabled = false;
    alert('Алдаа гарлаа, дахин оролдоно уу.');
  }
});
</script>
</body>
